<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пятнашки 2.0</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#151515,#303030);color:white;padding:20px 14px}.wrap{max-width:500px;margin:auto}h1{text-align:center;font-size:38px;margin:0}.sub{text-align:center;opacity:.7;margin-bottom:16px}.stats{display:flex;gap:8px;margin-bottom:12px}.stat{flex:1;text-align:center;background:#ffffff14;border-radius:15px;padding:8px}.stat b{display:block;font-size:24px}.stat span{opacity:.65;font-size:13px}select,button{font:inherit}select{width:100%;padding:13px;border:0;border-radius:14px;margin-bottom:12px;font-weight:700}.board{display:grid;gap:8px;background:#0c0c0c;padding:8px;border-radius:20px}.tile{border:0;border-radius:14px;background:#f4f4f4;color:#111;font-weight:800;font-size:clamp(30px,10vw,52px);aspect-ratio:1;box-shadow:0 5px #aaa}.tile:active{transform:scale(.94)}.blank{visibility:hidden}.controls{display:flex;gap:8px;margin-top:12px}.controls button{flex:1;border:0;border-radius:15px;padding:14px;font-weight:800}.primary{background:white;color:#111}.secondary{background:#ffffff18;color:white}.message{text-align:center;font-size:19px;font-weight:800;min-height:28px;margin:16px 0 5px}.best{text-align:center;opacity:.7}body.light{background:linear-gradient(135deg,#eef2f7,#ccd6e2);color:#111}body.light .secondary{background:#ffffff99;color:#111}body.blue{background:linear-gradient(135deg,#061b32,#155d8a)}</style></head>
<body><div class="wrap"><h1>🧩 Пятнашки</h1><div class="sub">Версия 2.0</div>
<div class="stats"><div class="stat"><b id="moves">0</b><span>Ходы</span></div><div class="stat"><b id="time">00:00</b><span>Время</span></div><div class="stat"><b id="best">—</b><span>Рекорд</span></div></div>
<select id="size"><option value="3">Легко — 3×3</option><option value="4" selected>Нормально — 4×4</option><option value="5">Сложно — 5×5</option></select>
<div id="board" class="board"></div><div class="controls"><button class="primary" id="new">🎮 Новая игра</button><button class="secondary" id="reset">↩️ Сначала</button></div>
<div class="controls"><button class="secondary" id="sound">🔊 Звук: Вкл</button><button class="secondary" id="theme">🎨 Тема</button></div>
<div id="message" class="message">Нажимай на плитку рядом с пустой клеткой.</div><div id="bestText" class="best"></div></div>
<script>
let n=4,a=[],moves=0,sec=0,timer=null,won=false,sound=true;
const B=document.getElementById('board'),M=document.getElementById('moves'),T=document.getElementById('time'),BEST=document.getElementById('best'),MSG=document.getElementById('message');
function fmt(x){return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}
function solved(){return a.every((v,i)=>i==a.length-1?v==0:v==i+1)}
function legal(x){let inv=0;for(let i=0;i<x.length;i++)for(let j=i+1;j<x.length;j++)if(x[i]&&x[j]&&x[i]>x[j])inv++;if(n%2)return inv%2==0;return (inv+n-Math.floor(x.indexOf(0)/n))%2==0}
function draw(){B.style.gridTemplateColumns=`repeat(${n},1fr)`;B.innerHTML='';a.forEach((v,i)=>{let q=document.createElement('button');q.className='tile'+(!v?' blank':'');q.textContent=v||'';q.onclick=()=>move(i);B.appendChild(q)});M.textContent=moves;T.textContent=fmt(sec);BEST.textContent=localStorage.getItem('best'+n)||'—'}
function beep(){if(!sound)return;try{let c=new AudioContext,o=c.createOscillator(),g=c.createGain();o.frequency.value=600;g.gain.value=.03;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.06)}catch(e){}}
function shuffle(){do{a=Array.from({length:n*n},(_,i)=>i);for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}while(!legal(a)||solved())}
function start(){clearInterval(timer);timer=null;moves=sec=0;won=false;MSG.textContent='Нажимай на плитку рядом с пустой клеткой.';shuffle();draw()}
function move(i){if(won)return;let z=a.indexOf(0),r=Math.floor(i/n),c=i%n,zr=Math.floor(z/n),zc=z%n;if(Math.abs(r-zr)+Math.abs(c-zc)!=1)return;[a[i],a[z]]=[a[z],a[i]];moves++;beep();if(!timer)timer=setInterval(()=>{sec++;T.textContent=fmt(sec)},1000);draw();if(solved()){won=true;clearInterval(timer);let k='best'+n,o=localStorage.getItem(k);if(!o||moves<+o)localStorage.setItem(k,moves);MSG.textContent='🎉 Победа за '+moves+' ходов!';document.getElementById('bestText').textContent='🏆 Рекорд сохраняется на этом устройстве';draw()}}
document.getElementById('new').onclick=start;document.getElementById('reset').onclick=start;document.getElementById('size').onchange=e=>{n=+e.target.value;start()};
document.getElementById('sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊 Звук: Вкл':'🔇 Звук: Выкл'};
document.getElementById('theme').onclick=()=>{document.body.classList.remove('light','blue');let x=localStorage.getItem('theme')||'dark';x=x=='dark'?'light':x=='light'?'blue':'dark';if(x!='dark')document.body.classList.add(x);localStorage.setItem('theme',x)};
let th=localStorage.getItem('theme');if(th&&th!='dark')document.body.classList.add(th);start();
</script></body></html>
